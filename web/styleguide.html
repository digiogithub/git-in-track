<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <title>git-in-track — design system</title>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('gintrack:theme');
          if (stored === 'dark' || stored === 'light') {
            document.documentElement.dataset.theme = stored;
          }
        } catch (error) {
          /* Storage can throw in private modes; the media query still works. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dev/styleguide-main.tsx"></script>
  </body>
</html>
