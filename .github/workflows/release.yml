name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.23"
  NODE_VERSION: "22"

jobs:
  preflight:
    # The repository is still in its planning phase. Until the Phase 0 scaffold
    # (go.mod, web/package.json) lands, every other job is skipped so that the
    # workflow stays green instead of failing on a missing toolchain.
    name: Preflight (scaffold present?)
    runs-on: ubuntu-latest
    outputs:
      scaffold: ${{ steps.check.outputs.scaffold }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect scaffold
        id: check
        run: |
          if [ -f go.mod ] && [ -f web/package.json ]; then
            echo "scaffold=true" >> "$GITHUB_OUTPUT"
          else
            echo "scaffold=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Phase 0 scaffold not found (go.mod / web/package.json); skipping build jobs."
          fi

  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    needs: [preflight]
    if: needs.preflight.outputs.scaffold == 'true'
    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build WASM core
        env:
          GOOS: js
          GOARCH: wasm
        run: go build -trimpath -o web/public/core.wasm ./wasm

      - name: Build web bundle
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Verify embedded assets exist
        run: |
          test -f web/dist/index.html
          test -f web/dist/core.wasm || test -f web/public/core.wasm

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
