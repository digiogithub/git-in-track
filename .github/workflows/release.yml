name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "22"

jobs:
  preflight:
    # The Phase 0 scaffold has landed. This job no longer skips the release: it
    # asserts the layout GoReleaser needs and fails the tag build if it is gone.
    name: Preflight (repository layout)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the expected layout
        run: |
          missing=0
          for path in go.mod go.sum .goreleaser.yaml Dockerfile cmd/gintrack wasm \
                      web/package.json web/package-lock.json web/dist/.gitkeep; do
            if [ ! -e "$path" ]; then
              echo "::error::missing $path"
              missing=1
            fi
          done
          exit "$missing"

  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    needs: [preflight]
    permissions:
      # contents: write publishes the GitHub Release; packages: write pushes the
      # images to ghcr.io. The tap and the bucket live in other repositories, so
      # GITHUB_TOKEN cannot reach them and they use their own secrets below.
      contents: write
      packages: write
    steps:
      # Fail before anything is built rather than half way through publishing.
      # A missing token would otherwise produce a GitHub Release with no formula
      # and no manifest, which is worse than no release at all.
      - name: Verify the publishing credentials
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          missing=0
          for name in HOMEBREW_TAP_TOKEN SCOOP_BUCKET_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::repository secret $name is not set. Create a fine-grained personal access token with Contents:read+write on the target repository (digiogithub/homebrew-tap for HOMEBREW_TAP_TOKEN, digiogithub/scoop-bucket for SCOOP_BUCKET_TOKEN) and store it as an Actions secret. See docs/09-ci-cd-and-releases.md section 10."
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      # GoReleaser's before.hooks rebuild these too, so this is belt and braces:
      # it lets the smoke test below run before a single binary is cross-built.
      - name: Build WASM core
        run: make wasm

      - name: WASM smoke test
        run: node scripts/wasm-smoke.mjs

      - name: Build web bundle
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Verify embedded assets exist
        run: |
          test -f web/dist/index.html
          test -f web/dist/core.wasm || test -f web/public/core.wasm

      - name: Validate the GoReleaser configuration
        run: go run github.com/goreleaser/goreleaser/v2@latest check

      # The arm64 image runs `apk add` for its own architecture, so the runner
      # needs binfmt emulation; the amd64 image does not.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN plus `packages: write` is enough for ghcr.io in the
      # repository's own namespace; no separate registry secret is needed.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cross-repository writes: the tap and the bucket are separate
          # repositories that GITHUB_TOKEN has no access to.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
