name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.23"
  NODE_VERSION: "22"

jobs:
  preflight:
    # The repository is still in its planning phase. Until the Phase 0 scaffold
    # (go.mod, web/package.json) lands, every other job is skipped so that the
    # workflow stays green instead of failing on a missing toolchain.
    name: Preflight (scaffold present?)
    runs-on: ubuntu-latest
    outputs:
      scaffold: ${{ steps.check.outputs.scaffold }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect scaffold
        id: check
        run: |
          if [ -f go.mod ] && [ -f web/package.json ]; then
            echo "scaffold=true" >> "$GITHUB_OUTPUT"
          else
            echo "scaffold=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Phase 0 scaffold not found (go.mod / web/package.json); skipping build jobs."
          fi

  go:
    name: Go (vet, test, lint)
    runs-on: ubuntu-latest
    needs: [preflight]
    if: needs.preflight.outputs.scaffold == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^web/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 7

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          args: --timeout=5m

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    needs: [preflight]
    if: needs.preflight.outputs.scaffold == 'true'
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm run test -- --run --coverage

      - name: Vite build
        run: npm run build

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  wasm:
    name: WASM core
    runs-on: ubuntu-latest
    needs: [preflight]
    if: needs.preflight.outputs.scaffold == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build core.wasm
        env:
          GOOS: js
          GOARCH: wasm
        run: go build -trimpath -o core.wasm ./wasm

      - name: Report size
        run: ls -lh core.wasm

      - name: Upload core.wasm
        uses: actions/upload-artifact@v4
        with:
          name: core-wasm
          path: core.wasm
          retention-days: 7

  build:
    name: Full build (embed frontend)
    runs-on: ubuntu-latest
    needs: [preflight, go, web, wasm]
    if: needs.preflight.outputs.scaffold == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build WASM core into web/public
        env:
          GOOS: js
          GOARCH: wasm
        run: go build -trimpath -o web/public/core.wasm ./wasm

      - name: Build web bundle
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build gintrack binary
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=ci -X main.commit=${{ github.sha }} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/gintrack ./cmd/gintrack

      - name: Smoke test
        run: |
          ./dist/gintrack version
          ./dist/gintrack --help

      - name: Upload dev binary
        uses: actions/upload-artifact@v4
        with:
          name: gintrack-linux-amd64-dev
          path: dist/gintrack
          retention-days: 7
