name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "22"
  # golangci-lint v2 reads the `version: "2"` schema in .golangci.yaml. Pinned so
  # that CI runs the exact linter release verified locally by `make lint`.
  GOLANGCI_LINT_VERSION: "v2.5.0"

jobs:
  preflight:
    # The Phase 0 scaffold has landed, so this job no longer skips the pipeline:
    # it asserts that the layout every other job depends on is still there and
    # fails loudly if a change removes it.
    name: Preflight (repository layout)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the expected layout
        run: |
          missing=0
          for path in go.mod go.sum Makefile .goreleaser.yaml .golangci.yaml \
                      cmd/gintrack wasm web/package.json web/package-lock.json \
                      web/dist/.gitkeep scripts/wasm-smoke.mjs; do
            if [ ! -e "$path" ]; then
              echo "::error::missing $path"
              missing=1
            fi
          done
          exit "$missing"

  workflows:
    name: Workflows (YAML + actionlint)
    runs-on: ubuntu-latest
    needs: [preflight]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Parse the workflow YAML
        run: |
          # PyYAML is preinstalled on the GitHub-hosted images; install it if the
          # image ever drops it (--break-system-packages for the PEP 668 python).
          python3 -c "import yaml" 2>/dev/null ||
            pip install --quiet --break-system-packages pyyaml
          python3 - <<'PY'
          import pathlib
          import sys

          import yaml

          failed = False
          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  yaml.safe_load(path.read_text(encoding="utf-8"))
              except yaml.YAMLError as error:
                  print(f"::error file={path}::{error}")
                  failed = True
              else:
                  print(f"yaml ok: {path}")
          sys.exit(1 if failed else 0)
          PY

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@latest

      - name: actionlint
        run: actionlint

  go:
    name: Go (vet, test, lint)
    runs-on: ubuntu-latest
    needs: [preflight]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^web/node_modules/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'ed:"
            echo "$unformatted"
            exit 1
          fi

      # npm installs third-party Go sources under web/node_modules (for example
      # flatted/golang). They are not part of this module and must never be
      # vetted, tested or linted; `make test-go` filters them the same way.
      - name: go vet
        run: go list ./... | grep -v '/web/node_modules/' | xargs go vet

      - name: go test (race + coverage)
        run: |
          go list ./... | grep -v '/web/node_modules/' |
            xargs go test -race -covermode=atomic -coverprofile=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 7

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    needs: [preflight]
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm run test -- --run

      - name: Vite build
        run: npm run build

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  wasm:
    name: WASM core
    runs-on: ubuntu-latest
    needs: [preflight]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # `make wasm` builds web/public/core.wasm and copies the wasm_exec.js of
      # this exact toolchain next to it; the two must always come from the same
      # Go release or the module fails to instantiate.
      - name: Build core.wasm and wasm_exec.js
        run: make wasm

      - name: Report size
        run: ls -lh web/public/core.wasm web/public/wasm_exec.js

      # Instantiates the module outside a browser and calls into the Go core, so
      # a WASM build that compiles but cannot answer fails here, not in the UI.
      - name: WASM smoke test
        run: node scripts/wasm-smoke.mjs

      - name: Upload core.wasm
        uses: actions/upload-artifact@v4
        with:
          name: core-wasm
          path: |
            web/public/core.wasm
            web/public/wasm_exec.js
          retention-days: 7

  build:
    name: Full build (embed frontend)
    runs-on: ubuntu-latest
    needs: [preflight, workflows, go, web, wasm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Strict order: WASM core -> Vite bundle -> Go binary that embeds it.
      - name: Build WASM core into web/public
        run: make wasm

      - name: Build web bundle
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build gintrack binary
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=ci -X main.commit=${{ github.sha }} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.builtBy=ci" \
            -o dist/gintrack ./cmd/gintrack

      - name: Smoke test
        run: |
          ./dist/gintrack version
          ./dist/gintrack --help

      - name: Upload dev binary
        uses: actions/upload-artifact@v4
        with:
          name: gintrack-linux-amd64-dev
          path: dist/gintrack
          retention-days: 7
