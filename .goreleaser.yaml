# GoReleaser configuration — see docs/09-ci-cd-and-releases.md, section 5.
# Artifacts are deliberately unsigned and unnotarized; checksums.txt is the
# integrity mechanism (ADR-011).
version: 2

project_name: gintrack

before:
  hooks:
    - go mod tidy
    - go mod download
    # The Go core compiled to WebAssembly, consumed by the web app.
    - sh -c "GOOS=js GOARCH=wasm go build -trimpath -o web/public/core.wasm ./wasm"
    # The React/Vite bundle that the binary embeds through go:embed.
    - sh -c "cd web && npm ci && npm run build"

builds:
  - id: gintrack
    main: ./cmd/gintrack
    binary: gintrack
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .CommitDate }}
      - -X main.builtBy=goreleaser
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids:
      - gintrack
    name_template: "gintrack_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - src: docs/**/*.md
        dst: docs
        strip_parent: false

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  abbrev: -1
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]\-\.]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]\-\.]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]\-\.]+\))??!?:.+$'
      order: 2
    - title: Refactors
      regexp: '^.*?refactor(\([[:word:]\-\.]+\))??!?:.+$'
      order: 3
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]\-\.]+\))??!?:.+$'
      order: 4
    - title: Others
      order: 999
  filters:
    exclude:
      - '^test:'
      - '^test\('
      - '^chore:'
      - '^chore\('
      - '^ci:'
      - '^ci\('
      - '^style:'
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch

# --- Distribution channels (docs/09-ci-cd-and-releases.md, section 10) --------
#
# Every block below is skipped automatically on a snapshot build, so
# `make release-snapshot` never talks to a tap, a bucket or a registry. The
# tokens are read from the environment and are supplied by the release workflow
# from GitHub Actions secrets; they are never written down here.

# Multi-arch images. Each entry builds one architecture from the release binary
# that GoReleaser has already cross-compiled, and docker_manifests below joins
# them under a single tag.
dockers:
  - id: linux-amd64
    ids:
      - gintrack
    image_templates:
      - "ghcr.io/digiogithub/git-in-track:{{ .Version }}-amd64"
    dockerfile: Dockerfile
    use: buildx
    goos: linux
    goarch: amd64
    extra_files:
      - LICENSE
      - README.md
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=Git-native, markdown-first project management for teams"
      - "--label=org.opencontainers.image.url=https://github.com/digiogithub/git-in-track"
      - "--label=org.opencontainers.image.source=https://github.com/digiogithub/git-in-track"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.licenses=MIT"

  - id: linux-arm64
    ids:
      - gintrack
    image_templates:
      - "ghcr.io/digiogithub/git-in-track:{{ .Version }}-arm64"
    dockerfile: Dockerfile
    use: buildx
    goos: linux
    goarch: arm64
    extra_files:
      - LICENSE
      - README.md
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=Git-native, markdown-first project management for teams"
      - "--label=org.opencontainers.image.url=https://github.com/digiogithub/git-in-track"
      - "--label=org.opencontainers.image.source=https://github.com/digiogithub/git-in-track"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.licenses=MIT"

docker_manifests:
  - name_template: "ghcr.io/digiogithub/git-in-track:{{ .Version }}"
    image_templates:
      - "ghcr.io/digiogithub/git-in-track:{{ .Version }}-amd64"
      - "ghcr.io/digiogithub/git-in-track:{{ .Version }}-arm64"
  # `latest` must keep pointing at the newest stable release, so a `-rc.N` tag
  # publishes its version tag and leaves this one where it is.
  - name_template: "ghcr.io/digiogithub/git-in-track:latest"
    skip_push: auto
    image_templates:
      - "ghcr.io/digiogithub/git-in-track:{{ .Version }}-amd64"
      - "ghcr.io/digiogithub/git-in-track:{{ .Version }}-arm64"

# Homebrew. A cask, not a formula: GoReleaser deprecated `brews` in v2.10 and
# `goreleaser check` now fails on it, because Homebrew wants pre-built binaries
# distributed as casks. Casks are macOS-only, which is the trade-off recorded in
# ADR-016; Linux Homebrew users take the tarball, `go install` or the image.
# The post-install hook clears the quarantine attribute that the unsigned-artifact
# policy of ADR-011 leaves on a downloaded archive — the whole reason Homebrew is
# the recommended macOS route.
homebrew_casks:
  - name: gintrack
    ids:
      - default
    binaries:
      - gintrack
    repository:
      owner: digiogithub
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/digiogithub/git-in-track
    description: Git-native, markdown-first project management for teams
    license: MIT
    # `auto` leaves the tap untouched for a pre-release tag, so `brew install`
    # never resolves to an rc.
    skip_upload: auto
    commit_author:
      name: goreleaser-bot
      email: bot@digio.es
    commit_msg_template: "brew: gintrack {{ .Tag }}"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/gintrack"]
          end

scoops:
  - name: gintrack
    ids:
      - default
    repository:
      owner: digiogithub
      name: scoop-bucket
      branch: main
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    directory: bucket
    homepage: https://github.com/digiogithub/git-in-track
    description: Git-native, markdown-first project management for teams
    license: MIT
    skip_upload: auto
    commit_author:
      name: goreleaser-bot
      email: bot@digio.es
    commit_msg_template: "scoop: gintrack {{ .Tag }}"

release:
  github:
    owner: digiogithub
    name: git-in-track
  draft: false
  prerelease: auto
  mode: replace
  name_template: "git-in-track {{ .Tag }}"
  header: |
    ## git-in-track {{ .Tag }}

    A git-native, markdown-first project management tool.
  footer: |
    ---

    ### Verifying your download

    All artifacts are listed in `checksums.txt` (SHA-256).

    ```bash
    sha256sum -c checksums.txt --ignore-missing        # Linux
    shasum -a 256 -c checksums.txt --ignore-missing    # macOS
    ```

    ### Unsigned binaries

    These binaries are **not code-signed and not notarized**.

    - **macOS**: `xattr -d com.apple.quarantine ./gintrack`, or System Settings >
      Privacy & Security > "Open Anyway".
    - **Windows**: SmartScreen > "More info" > "Run anyway", or
      `Unblock-File -Path .\gintrack_*.zip` before extracting.
    - **Linux**: `chmod +x gintrack`.

    **Full changelog**: https://github.com/digiogithub/git-in-track/compare/{{ .PreviousTag }}...{{ .Tag }}
